name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own key (see README). Without it the debug key is used.
      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/StickerBridge-v$VERSION.apk"
          # fixed name so .../releases/latest/download/StickerBridge.apk always works
          cp app/build/outputs/apk/release/app-release.apk dist/StickerBridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StickerBridge-apk
          path: dist/*.apk

      # Every push to main publishes (or updates) the release "v<versionName>".
      # To ship a new version: bump versionName/versionCode in app/build.gradle.kts and push.
      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: StickerBridge v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          make_latest: true
          body: |
            ## 📥 Install
            1. Download **StickerBridge.apk** below (open this page on your phone).
            2. Open it on your Android phone and allow "Install unknown apps" if asked.
            3. Follow the [guide](https://github.com/${{ github.repository }}#-how-to-use) ([Hindi guide](https://github.com/${{ github.repository }}/blob/main/docs/GUIDE_HINDI.md)).
          generate_release_notes: true
